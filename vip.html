<!-- Página 3 — Painel VIP. Título/frase à esquerda, navegação à direita,
     resumo VIP ao centro,filtro (busca + ALL/COM/SEM) abaixo dele. -->
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Tigrinho — VIP</title>

  <style>
    html, body { margin: 0; padding: 0; }
    .background-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
  </style>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/vip.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <div class="auth-loading" id="authLoading">
    <div class="auth-loading-spinner" aria-label="Carregando"></div>
  </div>

  <div class="auth-screen app-hidden" id="authScreen">
    <div class="auth-card">
      <span class="hero-badge">✨ Painel do Tigrinho 🐯</span>
      <h1>Acesse seu painel</h1>
      <p>Entre com sua conta Google para sincronizar seus dados entre aparelhos.</p>
      <button class="btn-primary auth-google-btn" id="googleLoginBtn" type="button">
        <span class="auth-google-icon" aria-hidden="true">G</span>
        Entrar com Google
      </button>
      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <svg class="background-svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="280" cy="280" r="280" fill="#1e3a8a" />
    <circle cx="1160" cy="280" r="280" fill="#ef4444" />
    <circle cx="280" cy="520" r="280" fill="#facc15" />
    <circle cx="1160" cy="520" r="280" fill="#15803d" />
  </svg>

  <main class="page-shell app-hidden" id="appMain">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Painel VIP</h1>
        <p>Resumo diário, semanal e mensal por plataforma e grupo.</p>
      </div>
      <nav class="top-nav" aria-label="Navegação">
        <span class="user-label" id="userLabel"></span>
        <a class="nav-home" href="index.html" title="Página inicial">🏠</a>
        <a href="calendario.html" title="Calendário">📅</a>
        <a href="edicao.html" title="Editar plataformas">📝</a>
        <a href="financeiro.html" title="Financeiro">💰</a>
        <button id="logoutBtn" type="button" title="Sair">Sair</button>
      </nav>
    </div>

    <section class="card-shell vip-card" aria-label="Resumo VIP">
      <div class="section-heading">
        <div>
          <h2>Bônus VIP</h2>
          <p>Resumo diário, semanal e mensal por plataforma e grupo.</p>
        </div>
      </div>

      <div id="vipTotals" class="vip-totals"></div>

      <div class="vip-filter-bar">
        <input type="search" id="vipSearch" placeholder="Buscar plataforma" aria-label="Buscar plataforma" />
        <button type="button" class="vip-filter-btn active" data-group="all">ALL</button>
        <button type="button" class="vip-filter-btn" data-group="com">COM APOSTA</button>
        <button type="button" class="vip-filter-btn" data-group="sem">SEM APOSTA</button>
      </div>

      <div id="vipSummary" class="vip-summary"></div>
    </section>
  </main>

  <!-- Modal genérico de alerta/confirmação (auth-guard.js usa em caso de
       falha ao carregar dados do Firestore — precisa existir em toda página). -->
  <div class="modal" id="appModal">
    <div class="modal-content">
      <p id="appModalMessage"></p>
      <div class="reset-modal-buttons">
        <button class="btn-confirm" id="appModalConfirmBtn" type="button">OK</button>
        <button class="btn-cancel-modal" id="appModalCancelBtn" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main-vip.js"></script>
</body>
</html>
