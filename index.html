<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Tigrinho</title>
  <style>
    html, body { margin: 0; padding: 0; }
    .background-svg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #safeModeBanner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  background: #b45309; color: #fff; text-align: center;
  font-weight: 700; font-size: 0.85rem; padding: 0.5rem;
}
    /* DIAGNÓSTICO TEMPORÁRIO (pelo celular, sem console) */
    #diagBox {
      position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 10000;
      max-height: 60vh; overflow: auto; display: none;
      background: #7f1d1d; color: #fff; font: 12px/1.4 monospace;
      padding: 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word;
    }
  </style>
  <!-- DIAGNÓSTICO TEMPORÁRIO: mostra na tela qualquer erro de carregamento
       ou de execução (o celular não tem console). Roda ANTES do app.
       Remover depois que o problema for encontrado (voltar ao index.html
       original). Não grava nada, não envia nada pra lugar nenhum. -->
  <script>
    (function () {
      function show(msg) {
        var box = document.getElementById('diagBox');
        if (!box) {
          box = document.createElement('div');
          box.id = 'diagBox';
          (document.body || document.documentElement).appendChild(box);
        }
        box.style.display = 'block';
        box.textContent += '• ' + msg + '\n\n';
      }
      window.__diagShow = show;
      // capture=true: pega também arquivo que não carregou (404) — script/css.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) {
          show('ARQUIVO NÃO CARREGOU: ' + (t.src || t.href));
          return;
        }
        show('ERRO: ' + (e.message || '') + '\nArquivo: ' + (e.filename || '?') + '\nLinha: ' + (e.lineno || '?') + ':' + (e.colno || '?'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('ERRO (promessa): ' + (r && (r.stack || r.message) ? (r.stack || r.message) : String(r)));
      });
      // Se em 12 s o app não saiu da tela de carregamento, avisa.
      setTimeout(function () {
        var loading = document.getElementById('authLoading');
        var main = document.getElementById('appMain');
        var login = document.getElementById('authScreen');
        var stuck = loading && !loading.classList.contains('app-hidden') &&
          main && main.classList.contains('app-hidden') &&
          login && login.classList.contains('app-hidden');
        if (stuck && !document.getElementById('diagBox')) {
          show('O app não saiu da tela de carregamento em 12 s e nenhum erro foi capturado. Tire um print e mande.');
        }
      }, 12000);
    })();
  </script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/platform-cards.css" />
  <link rel="stylesheet" href="css/sort-menu.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/card-customization.css" />
  <link rel="stylesheet" href="css/vip.css" />
  <link rel="stylesheet" href="css/manage-panel.css" />
  <link rel="stylesheet" href="css/finance.css" />
  <link rel="stylesheet" href="css/graficos.css" />
  <link rel="stylesheet" href="css/codigo.css" />
  <link rel="stylesheet" href="css/announcement.css" />
  <link rel="stylesheet" href="css/historico.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="safeModeBanner" class="app-hidden">🧪 MODO TESTE — nada está sendo salvo no banco de dados</div>
  <div class="auth-loading" id="authLoading">
    <div class="auth-loading-spinner" aria-label="Carregando"></div>
  </div>

  <div class="auth-screen app-hidden" id="authScreen">
    <div class="auth-card">
      <span class="hero-badge">✨ Painel do Tigrinho 🐯</span>
      <h1>Acesse seu painel</h1>
      <p>Entre com sua conta Google para sincronizar seus dados entre aparelhos.</p>
      <button class="btn-primary auth-google-btn" id="googleLoginBtn" type="button">
        <span class="auth-google-icon" aria-hidden="true">G</span>
        Entrar com Google
      </button>
      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <svg class="background-svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="280" cy="280" r="280" fill="#1e3a8a" />
    <circle cx="1160" cy="280" r="280" fill="#ef4444" />
    <circle cx="280" cy="520" r="280" fill="#facc15" />
    <circle cx="1160" cy="520" r="280" fill="#15803d" />
  </svg>

  <!-- appMain: igual ao antigo, só que agora é o ÚNICO main de todo o
       site. O nav aqui dentro é GLOBAL (antes se repetia em cada HTML) —
       os links usam #/rota em vez de nome-da-pagina.html. -->
  <main class="page-shell app-hidden" id="appMain">
    <div class="top-nav" style="justify-content:flex-end; margin: 0.5rem 0 1rem;">
      <span class="user-label" id="userLabel"></span>
      <a class="nav-home" href="#/inicio" title="Página inicial">🏠</a>
      <a href="#/calendario" title="Calendário">📅</a>
      <a href="#/vip" title="Painel VIP">VIP</a>
      <a href="#/edicao" title="Editar plataformas">📝</a>
      <a href="#/financeiro" title="Financeiro">💰</a>
      <a href="#/graficos" title="Gráficos">📊</a>
      <a href="#/perfil" title="Perfil">🪪</a>
    </div>

    <!-- appShell: o router troca SÓ o que está aqui dentro ao navegar. -->
    <div id="appShell"></div>
  </main>

  <div class="modal" id="appModal">
    <div class="modal-content">
      <p id="appModalMessage"></p>
      <div class="reset-modal-buttons">
        <button class="btn-confirm" id="appModalConfirmBtn" type="button">OK</button>
        <button class="btn-cancel-modal" id="appModalCancelBtn" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
